<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acme Plans — MySite</title>

  <body>
    <!-- Layout: Page Header -->

        <tfoot>
          <tr>
            <td colspan="4">All plans include SSL and daily backups</td>

    <!-- Layout: Page Footer -->
    <footer>
